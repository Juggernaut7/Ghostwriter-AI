name: Build Executa binary

on:
  push:
    branches:
      - fix/ghostwriter-protocol-distribution-v1.0.4
  workflow_dispatch:

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:executa:binary
      - name: Test packaged executable protocol
        env:
          GHOSTWRITER_EXECUTA_ENTRYPOINT: executas/ghostwriter/dist/binary-stage/bin/ghostwriter-ai-executa
          GHOSTWRITER_EXECUTA_BINARY: '1'
        run: npm run test:executa:protocol
      - name: Record artifact checksum
        run: sha256sum executas/ghostwriter/dist/artifacts/ghostwriter-ai-executa-1.0.4-linux-x86_64.tar.gz > executas/ghostwriter/dist/artifacts/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ghostwriter-ai-executa-1.0.4-linux-x86_64
          path: |
            executas/ghostwriter/dist/artifacts/ghostwriter-ai-executa-1.0.4-linux-x86_64.tar.gz
            executas/ghostwriter/dist/artifacts/SHA256SUMS
